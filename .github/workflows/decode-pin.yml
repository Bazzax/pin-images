name: Decode pin images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pins/**'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64-text images into binary
        run: |
          python3 << 'PY'
          import base64, pathlib, sys
          changed = False
          root = pathlib.Path("pins")
          if root.exists():
              for p in list(root.rglob("*")):
                  if not p.is_file():
                      continue
                  if p.suffix.lower() not in {".jpg", ".jpeg", ".png", ".webp", ".gif"}:
                      continue
                  data = p.read_bytes()
                  if data.startswith((b"\xff\xd8\xff", b"\x89PNG\r\n\x1a\n", b"RIFF", b"GIF87a", b"GIF89a")):
                      print(f"{p} already binary ({len(data)} bytes)")
                      continue
                  try:
                      raw = base64.b64decode(data, validate=True)
                  except Exception as e:
                      print(f"{p} is not valid base64: {e}")
                      sys.exit(1)
                  if not raw.startswith((b"\xff\xd8\xff", b"\x89PNG\r\n\x1a\n", b"RIFF", b"GIF87a", b"GIF89a")):
                      print(f"{p} decoded but is not a recognised image: {raw[:16]!r}")
                      sys.exit(1)
                  p.write_bytes(raw)
                  print(f"{p} decoded to binary ({len(raw)} bytes)")
                  changed = True
          pathlib.Path("/tmp/changed").write_text("yes" if changed else "no")
          PY
          if [ "$(cat /tmp/changed)" = "yes" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || git commit -m "Store pin images as binary files"
            git push
          fi
